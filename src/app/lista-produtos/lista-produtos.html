<h2>Produtos</h2>

@if (erro()) {
  <p class="erro">{{ erro() }}</p>
}

<form (ngSubmit)="salvar()">
  <input name="nome" placeholder="Nome" [(ngModel)]="novo.nome" required />
  <input name="preco" type="number" step="0.01" placeholder="Preço" [(ngModel)]="novo.preco" />
  <input name="quantidade" type="number" placeholder="Qtd." [(ngModel)]="novo.quantidade" />
  <button type="submit">Cadastrar</button>
</form>

@if (carregando()) {
  <p>Carregando... (a API pode levar até 1 minuto para acordar)</p>
} @else {
  <table>
    <tr>
      <th>Nome</th>
      <th>Preço</th>
      <th>Qtd.</th>
      <th></th>
    </tr>
    @for (p of produtos(); track p.id) {
      <tr>
        <td>{{ p.nome }}</td>
        <td>{{ p.preco }}</td>
        <td>{{ p.quantidade }}</td>
        <td><button (click)="excluir(p.id!)">Excluir</button></td>
      </tr>
    } @empty {
      <tr>
        <td colspan="4">Nenhum produto cadastrado.</td>
      </tr>
    }
  </table>
}
